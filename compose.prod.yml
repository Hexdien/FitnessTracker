services:
  app:
    build:
      context: .
    image: fitness-tracker:prod
    env_file:
      - path: .env.production
        required: false
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
