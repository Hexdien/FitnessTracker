services:
  app:
    build:
      context: .
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql://fitness:fitness@db:5432/fitness
      RUN_MIGRATIONS: "1"
      RUN_FOOD_SEED: "1"
      WAIT_FOR_DB: "1"
    ports:
      - "5000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
